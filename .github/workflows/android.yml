name: Build Android APK

# Builds a sideloadable APK of the app. The APK is a thin shell around the
# deployed web app, so it only needs rebuilding when the native shell changes
# (icon, name, URL) — not when content or UI changes.
#
# Download the result from the run's "Artifacts" section.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'public/icons/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Override with a repository variable of the same name:
      #   Settings -> Secrets and variables -> Actions -> Variables
      APP_URL: ${{ vars.APP_URL || 'https://jkyoutube.onrender.com' }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `webDir` must exist before Capacitor will sync, even though the app
      # loads the remote URL at runtime.
      - name: Build web assets
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The ubuntu-latest image already ships the Android SDK, so this uses it
      # directly rather than depending on a third-party installer action (which
      # is what failed here previously). It only tops up the one platform this
      # project compiles against, and prints what it found so a future failure
      # is diagnosable from the log alone.
      - name: Prepare Android SDK
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $SDK"
          ls "$SDK" 2>/dev/null || echo "!! SDK root not found"

          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK/cmdline-tools"
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"

          # Accept licences so the Android Gradle Plugin may also auto-download
          # anything still missing during the build.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          echo "--- before ---"
          "$SDKMANAGER" --list_installed 2>/dev/null | sed -n '1,25p' || true

          "$SDKMANAGER" --install "platforms;android-36" "platform-tools" || \
            echo "!! could not install platform 36 — relying on AGP auto-download"

          echo "--- after ---"
          "$SDKMANAGER" --list_installed 2>/dev/null | sed -n '1,25p' || true

          # Gradle finds the SDK via local.properties. It is gitignored.
          echo "sdk.dir=$SDK" > android/local.properties

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name '*.apk' -print
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/jkyoutube-${GITHUB_SHA::7}.apk"
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jkyoutube-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      # A failed Gradle build is far easier to diagnose with the report attached.
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: android/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
